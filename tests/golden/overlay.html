  <!-- Font League Spartan theo yêu cầu chính xác của người dùng -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script>
    // Tự động co giãn theo tỷ lệ 16:9 vừa khít mọi kích thước màn hình và độ phân giải Windows DPI
    function autoScaleOverlay() {
      const scaler = document.getElementById('overlay-scaler');
      if (!scaler) return;
      const winW = window.innerWidth || document.documentElement.clientWidth;
      const winH = window.innerHeight || document.documentElement.clientHeight;
      if (!winW || !winH) return;
      
      const scale = Math.min(winW / 1920, winH / 1080);
      scaler.style.transform = 'scale(' + scale + ')';
    }

    window.addEventListener('resize', autoScaleOverlay);
    window.addEventListener('orientationchange', autoScaleOverlay);
    document.addEventListener('DOMContentLoaded', autoScaleOverlay);
    window.addEventListener('load', autoScaleOverlay);
    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      setTimeout(autoScaleOverlay, 10);
    }
  </script>
</head>
