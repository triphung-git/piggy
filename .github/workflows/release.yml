name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build & Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-x86_64"
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: "--target x86_64-pc-windows-msvc"

          - platform: "macos-arm64"
            os: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"

          - platform: "linux-x86_64"
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: "--target x86_64-unknown-linux-gnu"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller Pillow

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            Web Overlay/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux System Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - name: Build Python Sidecar Binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/build_sidecar.py

      - name: Verify Sidecar Binary Exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if (-not (Test-Path "src-tauri/binaries/tft-backend-${{ matrix.target }}.exe")) {
            throw "Sidecar binary not found!"
          }

      - name: Verify Sidecar Binary Exists (Unix)
        if: runner.os != 'Windows'
        run: |
          test -f "src-tauri/binaries/tft-backend-${{ matrix.target }}" || exit 1
          chmod +x "src-tauri/binaries/tft-backend-${{ matrix.target }}"

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: "Web Overlay"
        run: npm ci

      - name: Build Frontend
        working-directory: "Web Overlay"
        run: npm run build

      - name: Configure Updater Signing
        id: updater_config
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY secret not found in repository. Disabling updater artifacts to prevent build failure."
            python - <<'EOF'
import json
p = 'src-tauri/tauri.conf.json'
with open(p, 'r', encoding='utf-8') as f:
    d = json.load(f)
d['bundle']['createUpdaterArtifacts'] = False
with open(p, 'w', encoding='utf-8') as f:
    json.dump(d, f, indent=2)
EOF
            echo "signing_enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "TAURI_SIGNING_PRIVATE_KEY detected. Updater signing will proceed."
            echo "signing_enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Tauri Desktop Application & Draft Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('TFT Post-Match Studio {0}', github.ref_name) || 'TFT Post-Match Studio v__VERSION__' }}
          releaseBody: "See the assets below to download and install for Windows, macOS, or Linux."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: ${{ steps.updater_config.outputs.signing_enabled == 'true' }}
          args: ${{ matrix.args }}

  publish-release:
    name: Publish Release
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Draft Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
