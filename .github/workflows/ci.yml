name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller ruff pytest pytest-cov responses httpx

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Pytest Test Suite
        run: pytest -v

  frontend-check:
    name: Frontend TypeScript & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Frontend Dependencies
        working-directory: "Web Overlay"
        run: npm ci

      - name: Verify TypeScript & Build Output
        working-directory: "Web Overlay"
        run: npm run build

  sidecar-dry-run:
    name: Sidecar Packaging Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller Pillow

      - name: Test Build Sidecar
        env:
          TARGET: x86_64-unknown-linux-gnu
        run: |
          python scripts/build_sidecar.py
          test -f src-tauri/binaries/tft-backend-x86_64-unknown-linux-gnu
